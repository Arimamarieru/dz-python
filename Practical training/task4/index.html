<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="inputs">
            <input id="first-number" type="text" placeholder="Первое число">
            <input id="second-number" type="text" placeholder="Второе число">
        </div>
        <div class="buttons">
            <button id="sum">Сумма</button>
            <button id="difference">Разность</button>
            <button id="product">Произведение</button>
            <button id="division">Деление</button>
        </div>
        <div id="result" class="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
